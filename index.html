<!DOCTYPE html>
<html>
  <head>
    <!-- *********************** Libraries VR A-Aframe ************************ -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- *********** library for Animation mixer ***********  -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.5.0/dist/aframe-extras.loaders.min.js"></script>

  </head>
  <body>
    <a-scene>
      
      <a-assets>
        <a-assets-item
          id="cofre"
          src="assets/cofre_zelda/scene.gltf"
        ></a-assets-item>
      </a-assets>
      <a-entity
        id="tesoro"
        gltf-model="#cofre"
        scale="0.04 0.04 0.04"
        position="0 -2 -8"
        rotation="30 0 0"
        animation-mixer
        
      ></a-entity>
      <!-- <a-camera gps-new-camera rotation-reader></a-camera> -->
    </a-scene>

    
  </body>
</html>
