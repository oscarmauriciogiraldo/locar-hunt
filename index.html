<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <!-- LocAR.js -->
    <script src="https://unpkg.com/locar@latest/dist/locar.js"></script>
  </head>
  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false'
      renderer="antialias: true; alpha: true"
    >
      <a-assets>
        <a-assets-item
          id="cofre"
          src="assets/cofre_zelda/scene.gltf"
        ></a-assets-item>
      </a-assets>
      <a-entity
        id="tesoro"
        gltf-model="#cofre"
        scale="0.02 0.02 0.02"
        position="0 -2 -3"
        rotation="30 0 0"
        animation-mixer
        
      ></a-entity>
      <a-camera gps-new-camera rotation-reader></a-camera>
      <!-- <a-box color="red" gps-new-entity-place="latitude: 51.0501; longitude: -0.72" depth="2" height="2" width="2"></a-box> -->
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const locar = new LocAR.LocationBased();
        locar.fakeGps(-0.72, 51.05);
      });
    </script>
  </body>
</html>
